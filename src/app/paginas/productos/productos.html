<header class="encabezado">
  <p>CATÁLOGO LOCAL</p>
  <h1>Productos</h1>
  <span>Selecciona un producto para consultar su información completa.</span>
  <a routerLink="/admin-productos" pButton>
    <span pButtonLabel>Agregar o administrar productos</span>
  </a>
</header>

<section class="cuadricula">
  @for (producto of (productos | async); track producto.id) {
    <app-tarjeta-producto
      [producto]="producto"
      [agregado]="favoritosServicio.existe(producto.id)"
      (favoritoSeleccionado)="agregarAFavoritos($event)"
    />
  } @empty {
    <p>No hay productos disponibles.</p>
  }
</section>
