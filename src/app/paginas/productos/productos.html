<header class="encabezado">
  <p>CATÁLOGO LOCAL</p>
  <h1>Productos</h1>
  <span>Selecciona un producto para consultar su información completa.</span>

  <div class="acciones-catalogo" aria-label="Administración del catálogo">
    <a routerLink="/admin-productos" pButton class="accion-catalogo accion-principal">
      <span pButtonLabel>Agregar productos</span>
    </a>

    <a routerLink="/categorias" pButton class="accion-catalogo accion-secundaria">
      <span pButtonLabel>Administrar categorías</span>
    </a>
  </div>
</header>

<section class="cuadricula">
  @for (producto of (productos | async); track producto.id) {
    <app-tarjeta-producto
      [producto]="producto"
      [agregado]="favoritosServicio.existe(producto.id)"
    (favoritoSeleccionado)="cambiarFavorito($event)"
    />
  } @empty {
    <p>No hay productos disponibles.</p>
  }
</section>
